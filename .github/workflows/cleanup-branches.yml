# One-time remote branch consolidation. Triggered only when this workflow file
# changes on main, or explicitly via workflow_dispatch. No branches are created.
name: Retire audited branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arena-branch-cleanup
  cancel-in-progress: false
jobs:
  clean:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout primary branch with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Audit every branch before deleting
        run: node tools/clean-merged-branches.mjs --dry-run
      - name: Delete audited GitHub branches atomically
        run: node tools/clean-merged-branches.mjs
      - name: Verify only main exists on GitHub
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote --heads origin | awk '{print $2}')"
          if [ "$actual" != 'refs/heads/main' ]; then
            echo "::error::There are still branches besides main: $actual"
            exit 1
          fi
          echo 'Verified: only refs/heads/main remains on GitHub'
