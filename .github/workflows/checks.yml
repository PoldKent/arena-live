name: Arena Live checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ARENA_TEST_CSS: styles/arena-ui.css
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:mobile
      - run: npm run test:performance

  package-mobile:
    name: Build offline mobile HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm run build:mobile
      - name: Downloadable standalone gameplay build
        uses: actions/upload-artifact@v4
        with:
          name: arena-live-mobile-offline
          path: dist/Arena-Live-v*-movil.html
          if-no-files-found: error
          retention-days: 30
